# Dependency update workflow using Dependabot configuration
# Automates security updates and dependency maintenance
name: Dependency Updates

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-dependencies:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip pip-tools

      - name: Check for security vulnerabilities
        run: |
          pip-audit --desc --format=json --output=security-report.json || echo "Security issues found"
          pip-audit --desc || echo "Security audit completed"

      - name: Check for outdated packages
        run: |
          pip list --outdated || echo "Outdated packages check completed"

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.json

      - name: Create security issue if vulnerabilities found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let vulns = [];
            try {
              const report = JSON.parse(fs.readFileSync('security-report.json', 'utf8'));
              vulns = report.vulnerabilities || [];
            } catch (e) {
              console.log('Could not parse security report');
            }

            if (vulns.length > 0) {
              const title = `🔒 Security Vulnerabilities Found - ${new Date().toISOString().split('T')[0]}`;
              const body = `
              ## Security Vulnerabilities Detected

              The dependency scan found ${vulns.length} security vulnerabilities that need attention.

              ### Vulnerabilities
              ${vulns.slice(0, 10).map(v => `
              - **${v.package}** (${v.installed_version})
                - Vulnerability: ${v.vulnerability_id}
                - Severity: ${v.vulnerability_description}
                - Fix: Upgrade to ${v.fixed_version || 'latest version'}
              `).join('\n')}

              ${vulns.length > 10 ? `\n... and ${vulns.length - 10} more vulnerabilities` : ''}

              ### Next Steps
              1. Review the security report artifact in the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})
              2. Update affected dependencies
              3. Test the changes
              4. Merge the updates

              ### Automated Actions
              - Dependabot will automatically create PRs for some of these issues
              - High-severity issues should be addressed immediately

              ---
              This issue was created automatically by the dependency update workflow.
              `;

              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'dependencies', 'automated', 'priority-high']
              });
            }